spring.application.name=wattwise
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wattwise}
spring.datasource.username=${DB_USERNAME:wattwise}
spring.datasource.password=${DB_PASSWORD:ChangeThisLocalPassword123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,prometheus,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.enabled=true

# Business Analytics & Anomaly Detection Config
wattwise.analytics.default-tariff-rate=0.15
wattwise.anomaly.off-hours-threshold-watts=1500.0
wattwise.anomaly.excess-ratio-threshold=1.5
