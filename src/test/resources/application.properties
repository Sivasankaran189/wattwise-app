spring.application.name=wattwise-test

# Use in-memory H2 database for unit and integration testing
spring.datasource.url=jdbc:h2:mem:wattwise_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway during unit/integration tests so schema is generated cleanly from JPA
spring.flyway.enabled=false

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

wattwise.analytics.default-tariff-rate=0.15
wattwise.anomaly.off-hours-threshold-watts=1500.0
wattwise.anomaly.excess-ratio-threshold=1.5
