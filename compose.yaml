services:
  postgres:
    image: postgres:16-alpine
    container_name: wattwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wattwise
      POSTGRES_USER: wattwise
      POSTGRES_PASSWORD: ChangeThisLocalPassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wattwise -d wattwise"]
      interval: 5s
      timeout: 5s
      retries: 5

  wattwise-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wattwise-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/wattwise
      DB_USERNAME: wattwise
      DB_PASSWORD: ChangeThisLocalPassword123
      JAVA_OPTS: "-Xms128m -Xmx384m"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
