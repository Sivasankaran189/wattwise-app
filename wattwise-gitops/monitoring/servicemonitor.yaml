apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: wattwise-api-monitor
  namespace: wattwise
  labels:
    release: prometheus-stack
    app: wattwise-api
spec:
  selector:
    matchLabels:
      app: wattwise-api
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s
