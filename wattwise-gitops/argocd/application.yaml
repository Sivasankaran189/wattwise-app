apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wattwise-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-username/wattwise-gitops.git'
    targetRevision: HEAD
    path: apps/wattwise
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: wattwise
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
