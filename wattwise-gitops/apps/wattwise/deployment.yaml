apiVersion: apps/v1
kind: Deployment
metadata:
  name: wattwise-api
  labels:
    app: wattwise-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wattwise-api
  template:
    metadata:
      labels:
        app: wattwise-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: wattwise-api
          image: wattwise-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_URL
              value: "jdbc:postgresql://wattwise-postgres:5432/wattwise"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wattwise-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wattwise-db-credentials
                  key: password
            - name: WATTWISE_TARIFF_RATE
              valueFrom:
                configMapKeyRef:
                  name: wattwise-config
                  key: tariff-rate
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 2
