apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wattwise-postgres
  labels:
    app: wattwise-postgres
spec:
  serviceName: wattwise-postgres
  replicas: 1
  selector:
    matchLabels:
      app: wattwise-postgres
  template:
    metadata:
      labels:
        app: wattwise-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "wattwise"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: wattwise-db-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wattwise-db-credentials
                  key: password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
